# NexBrowse settings. Put this file next to NexBrowse.nex on the SD card.
# Lines are key=value; lines starting with # are ignored. Any setting left out
# uses the default built into NexBrowse.nex.

# Your NexBrowse server (the Azure App Service host name). "host:port" also works.
server=
port=80

# Access key, only if the server is configured with NexBrowse:AccessKeys.
key=

# Page opened at start-up.
home=https://example.com/

# Colours: a name (white, black, grey, lightgrey, red, green, blue, yellow, cyan,
# magenta, purple, orange, pink, lightblue, lightgreen, brown) or an 8-bit
# Next colour RRRGGGBB as a number: 171, 0xAB, $AB or #AB.
text_colour=white
link_colour=purple
button_colour=purple

# Screen rows to use (22-32), centred. 24 = the normal Spectrum screen area, which every
# display shows. Raise it if your TV/monitor shows more of the border (VGA/HDMI often show 32).
screen_rows=24

# Pictures: 1 = the Images checkbox starts ticked (thumbnails are fetched after the text).
# 0 = text only; press I on a page to switch pictures on or off at any time.
images=0

# Experimental: ask the ESP8266 for an SSL connection (usually fails; leave 0).
tls=0
