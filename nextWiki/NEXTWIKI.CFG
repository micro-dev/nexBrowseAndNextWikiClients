# NextWiki settings. Put this file next to NextWiki.nex on the SD card.
# Lines are key=value; lines starting with # are ignored. Any setting left out
# uses the default built into NextWiki.nex. NextWiki only reads English Wikipedia;
# there is no language setting.

# Your NextWiki server (the Azure App Service host name, or a PC on your network
# running the server). "host:port" also works.
server=
port=80

# Access key, only if the server is configured with NextWiki:AccessKeys.
key=

# Topic opened by the H key and shown in the Topic field at start-up.
home=ZX Spectrum Next

# Colours: a name (white, black, grey, lightgrey, red, green, blue, yellow, cyan,
# magenta, purple, orange, pink, lightblue, lightgreen, brown) or an 8-bit
# Next colour RRRGGGBB as a number: 171, 0xAB, $AB or #AB.
text_colour=white
link_colour=purple

# Screen rows to use (22-32), centred. 24 = the normal Spectrum screen area, which every
# display shows. Raise it if your TV/monitor shows more of the border (VGA/HDMI often show 32).
screen_rows=24

# Pictures: 1 = the Images checkbox starts ticked (up to 3 pictures per article, fetched
# after the text). 0 = text only; press I in an article to switch pictures on or off.
images=0

# Experimental: ask the ESP8266 for an SSL connection (usually fails; leave 0).
tls=0
